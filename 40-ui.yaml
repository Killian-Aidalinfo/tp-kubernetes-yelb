# ---------------------------------------------------------------------------
# Interface web (Angular servi par nginx, port 80). nginx renvoie les appels
# /api vers le Service yelb-appserver.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: yelb-ui
  namespace: yelb
  labels:
    app.kubernetes.io/name: yelb-ui
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: yelb
data:
  YELB_APPSERVER_ENDPOINT: http://yelb-appserver:4567
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yelb-ui
  namespace: yelb
  labels:
    app.kubernetes.io/name: yelb-ui
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: yelb
    app.kubernetes.io/version: "0.10"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: yelb-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yelb-ui
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: yelb
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ui
          image: mreferre/yelb-ui:0.10
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: yelb-ui
          # Pas de readOnlyRootFilesystem ni de non-root ici : le script de
          # démarrage de l'image réécrit la conf nginx et écoute sur le port 80.
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
# ClusterIP : le front n'est plus exposé directement, c'est l'Ingress
# (50-ingress.yaml) qui lui envoie le trafic.
apiVersion: v1
kind: Service
metadata:
  name: yelb-ui
  namespace: yelb
  labels:
    app.kubernetes.io/name: yelb-ui
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: yelb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: yelb-ui
  ports:
    - name: http
      port: 80
      targetPort: http
