{{- /* Base PostgreSQL : Secret, PVC, Deployment et Service. */ -}}
{{- $ctx := dict "root" . "component" "db" "version" .Values.db.image.tag -}}
{{- $name := include "yelb.componentName" $ctx -}}
{{- /* Secret du mot de passe : créé par le chart, sauf si db.existingSecret
       désigne un Secret fourni d'ailleurs (ex. par Sealed Secrets, TP 4). */ -}}
{{- $secretName := .Values.db.existingSecret | default $name -}}
{{- if not .Values.db.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "yelb.labels" $ctx | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.db.password | quote }}
{{- end }}
---
# Script d'initialisation de la base, exécuté par l'image au premier
# démarrage (volume vide). Fourni par le chart pour pouvoir utiliser l'image
# officielle postgres, qui ne le contient pas (TP 5, bonus Trivy).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-init
  labels:
    {{- include "yelb.labels" $ctx | nindent 4 }}
data:
  init-yelb-db.sql: |
    CREATE DATABASE yelbdatabase;
    \connect yelbdatabase;
    CREATE TABLE restaurants (
      name  char(30),
      count integer,
      PRIMARY KEY (name)
    );
    INSERT INTO restaurants (name, count) VALUES ('outback', 0);
    INSERT INTO restaurants (name, count) VALUES ('bucadibeppo', 0);
    INSERT INTO restaurants (name, count) VALUES ('chipotle', 0);
    INSERT INTO restaurants (name, count) VALUES ('ihop', 0);
{{- if .Values.db.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    {{- include "yelb.labels" $ctx | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.db.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.db.persistence.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "yelb.labels" $ctx | nindent 4 }}
spec:
  # Une seule instance : deux PostgreSQL sur le même volume le corrompraient.
  replicas: 1
  # Recreate : un volume ReadWriteOnce ne peut pas être monté par deux pods
  # pendant une mise à jour.
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "yelb.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yelb.labels" $ctx | nindent 8 }}
      annotations:
        {{- if not .Values.db.existingSecret }}
        # Le pod est recréé si le mot de passe change.
        checksum/secret: {{ .Values.db.password | sha256sum }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.podSecurity.restricted }}
      # Utilisateur postgres de l'image (db.runAsUser) ; fsGroup rend le
      # volume accessible en écriture à ce groupe.
      securityContext:
        {{- include "yelb.restrictedPodSecurityContext" (dict "uid" .Values.db.runAsUser "fsGroup" .Values.db.runAsUser) | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ include "yelb.image" .Values.db.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: POSTGRES_PASSWORD
            # Sous-dossier : la racine d'un volume ext4 contient lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          {{- if .Values.podSecurity.restricted }}
          securityContext:
            {{- include "yelb.restrictedContainerSecurityContext" (dict "readOnly" false) | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "yelbdatabase"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: init
          configMap:
            name: {{ $name }}-init
        - name: data
          {{- if .Values.db.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "yelb.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "yelb.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
