{{- /* API : ConfigMap, Deployment et Service. */ -}}
{{- $ctx := dict "root" . "component" "appserver" "version" .Values.appserver.image.tag -}}
{{- $name := include "yelb.componentName" $ctx -}}
{{- $config := include "yelb.appserverConfig" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "yelb.labels" $ctx | nindent 4 }}
data:
  {{- $config | nindent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "yelb.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.appserver.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "yelb.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yelb.labels" $ctx | nindent 8 }}
      annotations:
        # Les pods sont recréés quand la ConfigMap change (helm upgrade).
        checksum/config: {{ $config | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.podSecurity.restricted }}
      securityContext:
        {{- include "yelb.restrictedPodSecurityContext" (dict "uid" 1001) | nindent 8 }}
      {{- end }}
      containers:
        - name: appserver
          image: {{ include "yelb.image" .Values.appserver.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 4567
          envFrom:
            - configMapRef:
                name: {{ $name }}
          {{- if .Values.podSecurity.restricted }}
          securityContext:
            {{- include "yelb.restrictedContainerSecurityContext" (dict "readOnly" true) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- else }}
          securityContext:
            allowPrivilegeEscalation: false
          {{- end }}
          resources:
            {{- toYaml .Values.appserver.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/hostname
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/hostname
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
      {{- if .Values.podSecurity.restricted }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "yelb.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "yelb.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 4567
      targetPort: http
{{- define "yelb.appserverConfig" -}}
# RACK_ENV=custom : l'API lit les adresses de ses dépendances dans ces
# variables, préfixées par le nom de la release.
RACK_ENV: custom
YELB_DB_SERVER_ENDPOINT: {{ include "yelb.componentName" (dict "root" . "component" "db") }}
REDIS_SERVER_ENDPOINT: {{ include "yelb.componentName" (dict "root" . "component" "redis") }}
{{- end }}
