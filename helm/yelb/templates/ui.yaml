{{- /* Interface web : ConfigMap, Deployment et Service. */ -}}
{{- $ctx := dict "root" . "component" "ui" "version" .Values.ui.image.tag -}}
{{- $name := include "yelb.componentName" $ctx -}}
{{- $config := include "yelb.uiConfig" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "yelb.labels" $ctx | nindent 4 }}
data:
  {{- $config | nindent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "yelb.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "yelb.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yelb.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ $config | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ui
          image: {{ include "yelb.image" .Values.ui.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: {{ $name }}
          # Pas de non-root ni de lecture seule : le script de démarrage de
          # l'image réécrit la conf nginx et écoute sur le port 80.
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "yelb.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "yelb.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- define "yelb.uiConfig" -}}
# nginx du front relaie /api vers ce Service.
YELB_APPSERVER_ENDPOINT: http://{{ include "yelb.componentName" (dict "root" . "component" "appserver") }}:4567
{{- end }}
