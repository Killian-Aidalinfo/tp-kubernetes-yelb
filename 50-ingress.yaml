# ---------------------------------------------------------------------------
# Ingress HTTPS : point d'entrée de l'appli, géré par Traefik.
#
# L'annotation cert-manager.io/cluster-issuer suffit : cert-manager voit
# l'Ingress, crée un objet Certificate pour les hôtes du bloc `tls`, obtient
# le certificat auprès de Let's Encrypt et le range dans le Secret `yelb-tls`,
# que Traefik utilise ensuite.
#
# Étape 1 : letsencrypt-staging (certificat de test, alerte du navigateur).
# Étape 2 : passer à letsencrypt-prod -> vrai cadenas.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yelb
  namespace: yelb
  labels:
    app.kubernetes.io/name: yelb-ui
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: yelb
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    # Entrée HTTPS (port 443) de Traefik uniquement.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - demo.killian-stein-3.lab-cesi.fr
      secretName: yelb-tls   # créé et renouvelé par cert-manager
  rules:
    - host: demo.killian-stein-3.lab-cesi.fr
      http:
        paths:
          # Tout le site, y compris /api : c'est le nginx du front qui relaie
          # ensuite /api vers le Service yelb-appserver.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yelb-ui
                port:
                  name: http
