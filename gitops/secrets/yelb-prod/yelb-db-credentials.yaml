# SealedSecret du mot de passe PostgreSQL, généré par kubeseal.
# On peut le commiter : seul le contrôleur Sealed Secrets du cluster qui l'a
# chiffré peut le déchiffrer.
# EXEMPLE : celui-ci a été chiffré pour le cluster de test de l'auteur. Il
# faut le régénérer pour votre cluster (gitops/README.md, étape 1).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: yelb-db-credentials
  namespace: yelb-prod
spec:
  encryptedData:
    POSTGRES_PASSWORD: 
  template:
    metadata:
      name: yelb-db-credentials
      namespace: yelb-prod
